name: Selenium Java Tests

on:
  push:
    paths:
      - 'selenium-java-automation/**'
  pull_request:
    paths:
      - 'selenium-java-automation/**'
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium-java-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run Selenium TestNG suite
        run: mvn clean test
